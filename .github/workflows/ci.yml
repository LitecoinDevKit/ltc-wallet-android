name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    name: Fetch AAR + assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Fetch blessed AAR (3.1.0-litecoin.3)
        run: bash ./scripts/fetch-aar.sh 3.1.0-litecoin.3

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
